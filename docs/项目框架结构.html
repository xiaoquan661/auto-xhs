/* 代码与功能对照：以模块为行，策略与作用为列。 */
.code-tools{padding:20px 22px 15px;border-bottom:1px solid #e1e9f1}
.code-search{display:flex;align-items:center;gap:10px;background:#f7faff;border:1px solid #c9d9e8;border-radius:8px;padding:0 12px}
.code-search>span{font-size:24px;color:#66839f;line-height:1}
.code-search input{border:0;background:transparent;outline:0;width:100%;min-width:0;padding:11px 0;color:var(--ink);font-size:13px}
.code-filters{display:flex;gap:7px;flex-wrap:wrap;margin-top:13px}
.code-filters button{border:1px solid #d6e0eb;background:white;color:#5b728a;border-radius:6px;padding:5px 10px;font-size:11px}
.code-filters button[aria-pressed="true"]{color:#225da9;background:#eaf3ff;border-color:#91b3df}
.code-count{font-size:11px;color:var(--muted);margin-top:10px;text-align:right}
.code-table-scroll{overflow-x:auto;overscroll-behavior-x:contain}
.code-matrix{table-layout:fixed;min-width:900px;font-size:12px}
.code-matrix th{padding:13px 18px;background:#eff4fa;font-size:11px}
.code-matrix th:nth-child(1){width:32%}.code-matrix th:nth-child(2){width:18%}.code-matrix th:nth-child(3){width:25%}.code-matrix th:nth-child(4){width:25%}
.code-matrix td{padding:16px 18px;font-weight:400;color:#476077;vertical-align:middle}
.code-matrix td:nth-child(2){font-weight:600;color:#254969}
.code-matrix tbody tr:nth-child(even){background:#fafcfe}
.code-matrix tbody tr:hover{background:#f3f8ff}
.code-matrix tbody tr.is-selected{background:#edf5ff}
.code-role{display:inline-block;color:#6b8297;font-size:10px;line-height:1.5;margin-bottom:6px;border-left:2px solid #9db0c3;padding-left:6px}
.code-role.manager{border-color:#6394d5;color:#426ba4}.code-role.worker{border-color:#65a997;color:#3a806f}.code-role.browser{border-color:#b195cc;color:#8b6ca7}
.code-name{display:block;width:100%;border:0;padding:0;background:transparent;text-align:left;white-space:normal}
.code-name code{display:block;color:#204c76;font-size:12px;font-weight:600;line-height:1.6;overflow-wrap:anywhere}
.code-name>span{display:block;font-size:10px;color:#7190ab;margin-top:6px;line-height:1.5;font-weight:400}
.code-name:hover>span{color:var(--blue)}
.strategy-list{display:flex;flex-wrap:wrap;gap:5px}
.strategy-list span{padding:3px 7px;background:#eff5f9;border:1px solid #d9e5ed;border-radius:4px;color:#5b778c;font-size:10px;line-height:1.5}
.code-detail .path-pills{display:flex;flex-wrap:wrap;gap:5px;margin:12px 0 20px}
@media(max-width:700px){.code-tools{padding:14px}.code-search input{font-size:11px}.code-filters{gap:5px}.code-filters button{padding:5px 7px;font-size:10px}.code-count{font-size:10px}.code-matrix{min-width:820px}.code-matrix th,.code-matrix td{padding:13px}.code-matrix td{font-size:11px}}
@media print{.code-tools{display:none}.code-matrix{min-width:0}.code-matrix th,.code-matrix td{padding:8px}.code-matrix,.code-name code{font-size:9px}.code-name>span,.code-role,.strategy-list span{font-size:8px}}

/* 分层架构图：输入输出、条件节点与双层视图。 */
.graph-modebar{display:flex;align-items:center;justify-content:space-between;gap:14px;padding:13px 20px;border-bottom:1px solid #e2eaf2;background:#fafcfe}
.graph-modes{display:flex;gap:7px;flex-wrap:wrap}
.graph-modes button{border:1px solid #cbd9e7;background:white;border-radius:7px;padding:7px 12px;font-size:12px;color:#668099}
.graph-modes button[aria-pressed="true"]{background:#e9f2ff;color:#225fae;border-color:#8cb3e3;box-shadow:inset 0 -2px #7fa5d5}
.graph-types{display:flex;gap:8px;white-space:nowrap;font-size:10px;color:#73869a}
.graph-types span{padding:3px 7px;border:1px solid #dbe6ed;border-radius:4px;background:white}
.graph-types .type-gate{background:#fff7e9;color:#9c732c;border-color:#e8d8ba}
.graph-types .type-message{background:#edf8f2;color:#3e8c71;border-color:#c8e1d5}
.graph-types .type-store{background:#f2f3fc;color:#747c9e;border-color:#d9ddec}
.graph-node .node-kicker{display:inline-block;font-size:9px;font-weight:500;line-height:1.4;letter-spacing:.5px;color:#7190ad;margin-bottom:5px}
.graph-node .node-meta{display:grid;gap:4px;border-top:1px solid #e7edf3;padding-top:8px;margin-top:9px}
.graph-node .node-meta>span{display:flex;gap:6px;align-items:baseline;font-size:10px;font-weight:400;line-height:1.45;color:#60768a}
.graph-node .node-meta em{font-size:9px;font-style:normal;color:#a1b0be;flex-shrink:0}
.graph-node .node-meta>span>span{overflow-wrap:anywhere}
.graph-node.kind-decision{background:#fffbf2;border-color:#dcc695;border-left-color:#c7a35e;border-radius:3px 14px 3px 14px}
.graph-node.kind-decision .node-kicker{color:#a27b30}
.graph-node.kind-message{border-left-color:#65a58c;background:#fbfefc}
.graph-node.kind-message .node-kicker{color:#4c9278}
.graph-node.kind-store{border-top:3px double #b2c0d4}
.graph-node.kind-store .node-kicker{color:#7c83a1}
.graph-node.kind-interface .node-kicker{color:#788ba1}
.graph-node.kind-platform .node-kicker{color:#258f82}
.graph-node[aria-pressed="true"]{border-color:var(--blue);background:#f7fbff}
@media(max-width:1050px){.graph-types{display:none}}
@media(max-width:700px){.graph-modebar{padding:11px 13px;gap:8px}.graph-modes button{font-size:11px;padding:6px 9px}.graph-node .node-meta>span{font-size:10px}}
@media print{.graph-modebar{display:none}.graph-node .node-kicker{font-size:7px}.graph-node .node-meta>span{font-size:7px}.graph-node .node-meta{padding-top:5px;margin-top:5px;gap:2px}}

/* 连线标签以消息、条件和写入动作说明节点关系。 */
.edge-annotation{cursor:help}
.edge-annotation rect{fill:#fff;stroke:#bcd0e8;stroke-width:.8}
.edge-annotation text{font-family:"Segoe UI","Microsoft YaHei",sans-serif;font-size:10px;fill:#38628a;pointer-events:none}
.edge-annotation.back rect{stroke:#a6d2c2;fill:#fcfffd}
.edge-annotation.back text{fill:#2d806a}
.edge-annotation.control rect{stroke:#dfc79e;fill:#fffdf7}
.edge-annotation.control text{fill:#987334}
.label-leader{stroke:#9cb8d6;stroke-width:1;pointer-events:none}
.edge-annotation.back .label-leader{stroke:#8bbba9}.edge-annotation.control .label-leader{stroke:#ceb27e}
.edge-annotation.focus rect{stroke-width:1.6}

      "answer": "<p><strong>作品采集</strong>：人工点击 → 经理 API → SSH 固定命令 → 员工程序读取创作中心指标 → SSH 同步返回采集回执 → 经理导入结果及员工业务表。</p><p><strong>通知采集</strong>：同一路径调用员工通知固定程序，当前即时入口采集作品评论和新增关注。</p><p><strong>回收已有回执</strong>：经理通过 SFTP 读取员工已经形成的 outbox。重新采集平台数据通过作品或通知入口发起；已有回执回收负责导入已经产生的结果。</p><p>全部账号操作同机账号串行，最多三台机器并行，执行期间保持页面打开。账号忙时显示 DEFERRED；收到采集回执和数据库 SYNCED 分别核对。</p>"

function applyGraphScale(id){
 const graph=document.getElementById('graph-'+id),stage=graph.parentElement,z=graphZoom[id]||1;
 graph.style.transform=`scale(${z})`;stage.style.width=(graph.offsetWidth*z)+'px';stage.style.height=(graph.offsetHeight*z)+'px';
 const sheet=graph.closest('.architecture-sheet');
 sheet.querySelector('[data-graph-action="reset"]').textContent=Math.round(z*100)+'%';
 sheet.querySelector('[data-graph-action="out"]').disabled=z<=.35;
 sheet.querySelector('[data-graph-action="in"]').disabled=z>=1.8;
}
function setGraphZoom(id,value){
 const graph=document.getElementById('graph-'+id),scroller=graph.closest('.graph-scroll'),old=graphZoom[id]||1;
 const cx=(scroller.scrollLeft+scroller.clientWidth/2)/old,cy=(scroller.scrollTop+scroller.clientHeight/2)/old;
 graphZoom[id]=Math.max(.35,Math.min(1.8,Math.round(value*100)/100));applyGraphScale(id);
 scroller.scrollLeft=cx*graphZoom[id]-scroller.clientWidth/2;
 if(expandedGraph===id)scroller.scrollTop=cy*graphZoom[id]-scroller.clientHeight/2;
}
function setExpandedGraph(id,expand,focus=true){
 if(expand&&expandedGraph&&expandedGraph!==id)setExpandedGraph(expandedGraph,false,false);
 const sheet=document.getElementById('graph-'+id).closest('.architecture-sheet');
 sheet.classList.toggle('is-expanded',expand);expandedGraph=expand?id:null;
 document.body.classList.toggle('graph-expanded',expand);
 const button=sheet.querySelector('[data-graph-action="full"]');
 button.textContent=expand?'退出全屏':'全屏查看';button.setAttribute('aria-pressed',String(expand));
 if(expand){sheet.setAttribute('role','dialog');sheet.setAttribute('aria-modal','true');sheet.setAttribute('aria-label',graphFor(id).title);}
 else{sheet.removeAttribute('role');sheet.removeAttribute('aria-modal');sheet.removeAttribute('aria-label');}
 drawGraph(id);if(focus)button.focus({preventScroll:true});
}

function returnToGraph(id,nodeId){

 if(graphModes[id]!==mode){graphModes[id]=mode;selections[id]=nodeId;makeGraph(id);}

 selections[id]=nodeId;

function closeGraphSearch(id){
 document.getElementById('graph-search-results-'+id).hidden=true;
 document.querySelector(`[data-graph-search="${id}"]`).setAttribute('aria-expanded','false');
}
function renderGraphSearch(id){
 const input=document.querySelector(`[data-graph-search="${id}"]`),q=input.value.trim().toLowerCase(),panel=document.getElementById('graph-search-results-'+id);
 if(!q){closeGraphSearch(id);return;}
 const hits=[];
 for(const c of chapters.filter(c=>D.graphs[c.id]))for(const mode of ['detail','summary']){
  const g=mode==='detail'?D.graphDetails[c.id]:D.graphs[c.id];
  for(const n of g.nodes){
   const text=[n.title,n.sub,n.detail,...(n.meta||[]).map(m=>m.v)].join(' ').toLowerCase();
   if(text.includes(q))hits.push({chapter:c,mode,node:n,score:(n.title+' '+n.sub).toLowerCase().includes(q)?0:1});
  }
 }
 hits.sort((a,b)=>a.score-b.score);
 panel.innerHTML=`<small>${hits.length?'共 '+hits.length+' 个节点'+(hits.length>12?'，显示前 12 项':''):'没有匹配的节点，可尝试协议、端口或功能名'}</small>`+hits.slice(0,12).map(hit=>`<button type="button" data-find-chapter="${hit.chapter.id}" data-find-mode="${hit.mode}" data-find-node="${hit.node.id}">${esc(hit.node.title)}<small>${esc(hit.chapter.name)} · ${hit.mode==='detail'?'分层详图':'全流程总图'} · ${esc(hit.node.sub)}</small></button>`).join('');
 panel.hidden=false;input.setAttribute('aria-expanded','true');
}

 if(full)setExpandedGraph(id,true,false);locateGraphNode(id,nodeId);
}

function updateNodeFAQ(id,nodeId,open=false){
 const n=graphFor(id).nodes.find(n=>n.id===nodeId),x=D.explanations[nodeId],roles=D.nodeParticipation[nodeId].map(kind=>D.participation[kind]);
 document.getElementById('node-question-'+id).textContent=n.title+'：怎样处理、需要什么、产出什么？';
 document.getElementById('node-answer-'+id).innerHTML=`<p>${esc(n.detail)}</p><div class="participation-note">${D.nodeResponsibilities[nodeId]?`<p><strong>本节点分工：</strong>${esc(D.nodeResponsibilities[nodeId])}</p>`:''}${roles.map(role=>`<p><strong>${esc(role.label)}：</strong>${esc(role.detail)}</p>`).join('')}</div><dl class="explain-grid"><div><dt>为什么需要</dt><dd>${esc(x.why)}</dd></div><div><dt>前置条件</dt><dd>${esc(x.before)}</dd></div><div><dt>处理产出</dt><dd>${esc(x.output)}</dd></div></dl>${x.note?`<p class="note">${esc(x.note)}</p>`:''}${refsMarkup(n.refs)}<div class="faq-return"><button type="button" class="node-return" data-return-graph="${id}" data-return-node="${nodeId}">↑ 返回图中节点</button><small>定位并高亮当前节点及相邻连线</small></div>`;
 document.getElementById('node-faq-'+id).open=open;
}
function updateGraphChrome(id){
 const g=graphFor(id),container=document.getElementById('graph-'+id);
 document.getElementById('graph-title-'+id).textContent=g.title;
 document.getElementById('graph-count-'+id).textContent=`${g.nodes.length} 个节点 · ${g.edges.length} 条关系`;
 container.setAttribute('aria-label',g.title);
 container.classList.toggle('graph-detail',graphModes[id]==='detail');
 document.querySelectorAll(`[data-graph-chapter="${id}"]`).forEach(button=>button.setAttribute('aria-pressed',String(button.dataset.graphMode===graphModes[id])));
 document.querySelector('#chapter-'+id+' .graph-types').hidden=graphModes[id]!=='detail';

function makeGraph(id){
 const container=document.getElementById('graph-'+id),g=graphFor(id);
 container.innerHTML=g.lanes.map((l,c)=>`<div class="lane" data-lane="${c}"></div><div class="lane-title" data-lane-title="${c}">${esc(l[0])}<small>${esc(l[1])}</small></div>`).join('')+`<svg class="wires" aria-hidden="true"></svg>`+g.nodes.map(n=>`<button class="graph-node ${n.kind?'kind-'+n.kind:''}" id="${n.id}" data-node="${n.id}" data-column="${n.c}" type="button" aria-pressed="${n.id===selections[id]}" aria-controls="node-faq-${id}"><i class="node-dot" aria-hidden="true"></i>${n.kind?`<span class="node-kicker">${nodeKinds[n.kind]}</span>`:''}${participationMarkup(n.id)}<b>${esc(n.title)}</b><small>${esc(n.sub)}</small>${n.meta?`<span class="node-meta">${n.meta.map(m=>`<span><em>${esc(m.k)}</em><span>${esc(m.v)}</span></span>`).join('')}</span>`:''}</button>`).join('');
 container.onclick=event=>{
  const btn=event.target.closest('[data-node]');if(!btn)return;
  openNodeFAQ(id,btn.dataset.node);
 };
 updateNodeFAQ(id,selections[id]);updateGraphChrome(id);
}
function wrapEdgeLabel(text){
 const measure=wrapEdgeLabel.measure||(wrapEdgeLabel.measure=document.createElement('canvas').getContext('2d'));
 measure.font='10px "Segoe UI", "Microsoft YaHei", sans-serif';
 const lines=[];
 for(const paragraph of text.split('\n')){
  let line='';
  for(const char of paragraph){
   if(line&&measure.measureText(line+char).width>108){lines.push(line.trim());line=char;}
   else line+=char;
  }
  if(line.trim())lines.push(line.trim());
 }
 return lines;
}
function placeEdgeLabels(svg,paths,boxes,headers,width,height){
 const occupied=[...Object.values(boxes).map(b=>({x:b.x-3,y:b.y-3,w:b.w+6,h:b.h+6})),...headers];
 const placed=[];
 const overlaps=(a,b)=>a.x<b.x+b.w&&a.x+a.w>b.x&&a.y<b.y+b.h&&a.y+a.h>b.y;
 for(const group of svg.querySelectorAll('[data-label-edge]')){
  const text=group.querySelector('text'),bbox=text.getBBox(),w=bbox.width+12,h=bbox.height+8;
  text.setAttribute('transform',`translate(0,${-(bbox.y+bbox.height/2)})`);
  const rect=group.querySelector('rect');rect.setAttribute('x',-w/2);rect.setAttribute('y',-h/2);rect.setAttribute('width',w);rect.setAttribute('height',h);
  const points=paths[+group.dataset.labelEdge],candidates=[];
  for(let i=1;i<points.length;i++){
   const a=points[i-1],b=points[i],horizontal=a[1]===b[1],length=Math.abs(b[0]-a[0])+Math.abs(b[1]-a[1]);
   if(length<(horizontal?w:h)+6)continue;
   for(const t of [.5,.3,.7,.15,.85,.4,.6]){
    const ax=a[0]+(b[0]-a[0])*t,ay=a[1]+(b[1]-a[1])*t;
    if(horizontal&&(ax-w/2<Math.min(a[0],b[0])+2||ax+w/2>Math.max(a[0],b[0])-2))continue;
    if(!horizontal&&(ay-h/2<Math.min(a[1],b[1])+2||ay+h/2>Math.max(a[1],b[1])-2))continue;
    for(const offset of [0,-12,12,-24,24]){
     const x=ax+(horizontal?0:offset),y=ay+(horizontal?offset:0),r={x:x-w/2,y:y-h/2,w,h};
     if(r.x<6||r.x+w>width-6||r.y<5||r.y+h>height-5)continue;
     const collisions=occupied.filter(b=>overlaps(r,b)).length+placed.filter(b=>overlaps(r,{x:b.x-3,y:b.y-3,w:b.w+6,h:b.h+6})).length;
     candidates.push({x,y,ax,ay,r,collisions,score:collisions*10000+Math.abs(offset)*4+Math.abs(t-.5)*30+(horizontal?0:8)});
    }
   }
  }
  candidates.sort((a,b)=>a.score-b.score);
  const selected=candidates[0];
  if(!selected){group.dataset.layout='unplaced';continue;}
  group.setAttribute('transform',`translate(${selected.x},${selected.y})`);
  group.dataset.layout=selected.collisions?'overlap':'placed';
  const leader=group.querySelector('.label-leader');
  leader.setAttribute('x1',selected.ax-selected.x);leader.setAttribute('y1',selected.ay-selected.y);leader.setAttribute('x2',0);leader.setAttribute('y2',0);
  placed.push(selected.r);
 }
}
function drawGraph(id){
 if(!D.graphs[id])return;
 const graph=document.getElementById('graph-'+id);if(graph.closest('[hidden]'))return;
 const scroller=graph.closest('.graph-scroll'),baseWidth=Math.max(innerWidth<=700?860:900,scroller.clientWidth-12);
 graph.style.width=baseWidth+'px';graph.style.minWidth='0';
 const g=graphFor(id),width=graph.clientWidth,pad=25,gutter=graphModes[id]==='detail'?100:84,laneWidth=(width-2*pad-2*gutter)/3,inside=12,nodeWidth=laneWidth-inside*2;
 graph.querySelectorAll('[data-lane]').forEach(el=>{const c=+el.dataset.lane;el.style.left=(pad+c*(laneWidth+gutter))+'px';el.style.width=laneWidth+'px';});
 graph.querySelectorAll('[data-lane-title]').forEach(el=>{const c=+el.dataset.laneTitle;el.style.left=(pad+c*(laneWidth+gutter)+inside+1)+'px';el.style.width=(nodeWidth-2)+'px';});
 const boxes={},rowHeights=[];
 for(const n of g.nodes){const el=document.getElementById(n.id);el.style.width=nodeWidth+'px';el.style.height='auto';rowHeights[n.r]=Math.max(rowHeights[n.r]||0,el.offsetHeight);}
 const headers=[...graph.querySelectorAll('.lane-title')].map(el=>({x:el.offsetLeft-3,y:el.offsetTop-3,w:el.offsetWidth+6,h:el.offsetHeight+6}));
 const rows=[],rowGap=58;let y=Math.max(112,...headers.map(h=>h.y+h.h+50));
 for(let r=0;r<rowHeights.length;r++){rows[r]=y;y+=rowHeights[r]+rowGap;}
 const height=y-12;graph.style.height=height+'px';
 for(const n of g.nodes){const el=document.getElementById(n.id);const b={x:pad+n.c*(laneWidth+gutter)+inside,y:rows[n.r],w:nodeWidth,h:rowHeights[n.r],c:n.c,r:n.r};boxes[n.id]=b;el.style.left=b.x+'px';el.style.top=b.y+'px';el.style.height=b.h+'px';}
 const colors={down:'#3475c7',back:'#218e78',control:'#c18c46'},svg=graph.querySelector('svg'),paths=[];
 svg.setAttribute('width',width);svg.setAttribute('height',height);svg.setAttribute('viewBox',`0 0 ${width} ${height}`);
 let markup=`<defs>${Object.entries(colors).map(([t,c])=>`<marker id="arrow-${id}-${t}" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 L7 3.5 L0 7 Z" fill="${c}"/></marker>`).join('')}</defs>`;
 for(let i=0;i<g.edges.length;i++){
  const e=g.edges[i],a=boxes[e.a],b=boxes[e.b];let points=[];
  if(a.c===b.c){
   const down=b.r>a.r;
   if(Math.abs(a.r-b.r)===1){points=[[a.x+a.w/2,down?a.y+a.h:a.y],[b.x+b.w/2,down?b.y-3:b.y+b.h+3]];}
   else{
    const side=a.c===0?13:a.x-inside-gutter/2,sy=down?a.y+a.h:a.y,ty=down?b.y:b.y+b.h,gy1=sy+(down?rowGap/2:-rowGap/2),gy2=ty+(down?-rowGap/2:rowGap/2);
    points=[[a.x+a.w/2,sy],[a.x+a.w/2,gy1],[side,gy1],[side,gy2],[b.x+b.w/2,gy2],[b.x+b.w/2,down?ty-3:ty+3]];
   }
  }else if(a.r===b.r&&Math.abs(a.c-b.c)===1){
   const right=b.c>a.c;points=[[right?a.x+a.w:a.x,a.y+a.h/2],[right?b.x-3:b.x+b.w+3,b.y+b.h/2]];
  }else if(Math.abs(a.c-b.c)===1){
   const right=b.c>a.c,sx=right?a.x+a.w:a.x,tx=right?b.x-3:b.x+b.w+3,gx=(sx+tx)/2;
   points=[[sx,a.y+a.h/2],[gx,a.y+a.h/2],[gx,b.y+b.h/2],[tx,b.y+b.h/2]];
  }else{
   const right=b.c>a.c,sx=right?a.x+a.w:a.x,tx=right?b.x-3:b.x+b.w+3;
   const gx1=right?sx+inside+gutter/2:sx-inside-gutter/2,gx2=right?tx-inside-gutter/2:tx+inside+gutter/2,gy=Math.min(a.y,b.y)-rowGap/2;
   points=[[sx,a.y+a.h/2],[gx1,a.y+a.h/2],[gx1,gy],[gx2,gy],[gx2,b.y+b.h/2],[tx,b.y+b.h/2]];
  }
  paths.push(points);
  const path=points.map((p,j)=>(j?'L':'M')+p[0].toFixed(1)+' '+p[1].toFixed(1)).join(' ');
  markup+=`<path class="wire ${e.type}" data-edge="${i}" d="${path}" stroke="${colors[e.type]}" marker-end="url(#arrow-${id}-${e.type})"/>`;
 }
 for(let i=0;i<g.edges.length;i++){
  const e=g.edges[i];if(!e.label)continue;
  const lines=wrapEdgeLabel(e.label);
  markup+=`<g class="edge-annotation ${e.type}" data-label-edge="${i}"><title>${esc(e.label.replaceAll('\n',' '))}</title><line class="label-leader"/><rect rx="4"/><text text-anchor="middle">${lines.map((s,k)=>`<tspan x="0" y="${k*13}">${esc(s)}</tspan>`).join('')}</text></g>`;
 }
 svg.innerHTML=markup;
 placeEdgeLabels(svg,paths,boxes,headers,width,height);highlightEdges(id);applyGraphScale(id);
 graph.onpointerover=event=>{
  const label=event.target.closest('[data-label-edge]');if(!label)return;
  const selected=+label.dataset.labelEdge;
  graph.querySelectorAll('[data-edge]').forEach(el=>{el.classList.toggle('focus',+el.dataset.edge===selected);el.classList.toggle('dim',+el.dataset.edge!==selected);});
  graph.querySelectorAll('[data-label-edge]').forEach(el=>el.classList.toggle('focus',el===label));
 };
 graph.onpointerout=event=>{if(event.target.closest('[data-label-edge]'))highlightEdges(id);};
}
function highlightEdges(id){
 const g=graphFor(id),nodeId=selections[id];
 document.querySelectorAll('#graph-'+id+' [data-edge]').forEach(el=>{const e=g.edges[+el.dataset.edge],focus=e.a===nodeId||e.b===nodeId;el.classList.toggle('focus',focus);el.classList.toggle('dim',false);});
 document.querySelectorAll('#graph-'+id+' [data-label-edge]').forEach(el=>{const e=g.edges[+el.dataset.labelEdge];el.classList.toggle('focus',e.a===nodeId||e.b===nodeId);});
}
function activateGraphMode(id,mode){
 graphModes[id]=mode;selections[id]=graphFor(id).selected;
 makeGraph(id);drawGraph(id);
}

let codeRole='all',selectedCode=D.codeModules[0].id;
const roleLabels={manager:'经理侧',worker:'员工侧',browser:'浏览器 / 界面',shared:'共用 / 入口'};
function displayModule(name){
 if(name.endsWith('.json')||name.endsWith('.js')||name.endsWith('.py'))return name;
 return name.startsWith('xhs.')?'xhs/'+name.slice(4)+'.py':name+'.py';
}
function renderCodeRows(){
 const query=document.getElementById('code-search').value.trim().toLowerCase();
 const rows=D.codeModules.filter(r=>(codeRole==='all'||r.role===codeRole)&&(!query||[r.title,r.function,r.effect,...r.strategy,...r.refs.map(x=>x[0])].join(' ').toLowerCase().includes(query)));
 document.getElementById('code-count').textContent=`${rows.length} / ${D.codeModules.length} 组主要代码`;
 document.getElementById('code-rows').innerHTML=rows.length?rows.map(r=>`<tr data-code-row="${r.id}" class="${r.id===selectedCode?'is-selected':''}"><td><span class="code-role ${r.role}">${roleLabels[r.role]}</span><button class="code-name" type="button" data-code="${r.id}" aria-controls="code-detail">${r.primary.map(m=>`<code>${esc(displayModule(m))}</code>`).join('')}<span>${esc(r.title)} · 查看 FAQ ↗</span></button></td><td>${esc(r.function)}</td><td><div class="strategy-list">${r.strategy.map(s=>`<span>${esc(s)}</span>`).join('')}</div></td><td>${esc(r.effect)}</td></tr>`).join(''):`<tr><td colspan="4" class="empty">没有匹配的条目，试试文件名、功能名称或实现策略。</td></tr>`;
}
function updateCodeFAQ(id,open=false){
 selectedCode=id;const r=D.codeModules.find(r=>r.id===id);
 document.getElementById('code-question').textContent=r.title+'：对应什么功能，为什么采用这套策略？';
 document.getElementById('code-answer').innerHTML=`<p><strong>对应功能：</strong>${esc(r.function)}</p><div class="path-pills">${r.refs.map(([m])=>`<code>${esc(displayModule(m))}</code>`).join('')}</div><h4>当前怎样实现</h4><ol>${r.how.map(s=>`<li>${esc(s)}</li>`).join('')}</ol><h4>为什么这样组织</h4><p>${esc(r.why)}</p><h4>按什么顺序读代码</h4><p>${esc(r.follow)}</p>${refsMarkup(r.refs)}`;
 document.getElementById('code-detail').open=open;
 document.querySelectorAll('[data-code-row]').forEach(el=>el.classList.toggle('is-selected',el.dataset.codeRow===id));
}
for(const c of chapters.filter(c=>D.graphs[c.id]))makeGraph(c.id);
document.querySelectorAll('[data-graph-mode]').forEach(button=>button.addEventListener('click',()=>{
 activateGraphMode(button.dataset.graphChapter,button.dataset.graphMode);
}));
renderCodeRows();updateCodeFAQ(selectedCode);
document.getElementById('code-search').addEventListener('input',renderCodeRows);
document.querySelectorAll('[data-code-role]').forEach(button=>button.addEventListener('click',()=>{
 codeRole=button.dataset.codeRole;
 document.querySelectorAll('[data-code-role]').forEach(el=>el.setAttribute('aria-pressed',String(el===button)));
 renderCodeRows();
}));
document.getElementById('code-rows').addEventListener('click',event=>{
 const button=event.target.closest('[data-code]');if(!button)return;
 updateCodeFAQ(button.dataset.code,true);
 document.getElementById('code-detail').scrollIntoView({behavior:'smooth',block:'start'});
});
function activate(id,scroll=true,remember=true){
 if(!chapters.some(c=>c.id===id))return;
 if(id!==active&&scroll&&remember)navigationTrail.push(captureLocation());
 if(expandedGraph&&expandedGraph!==id)setExpandedGraph(expandedGraph,false,false);
 active=id;updateReturnButton();
 document.querySelectorAll('.chapter').forEach(el=>el.hidden=el.id!=='chapter-'+id);
 nav.querySelectorAll('[data-chapter]').forEach(el=>el.setAttribute('aria-current',el.dataset.chapter===id?'page':'false'));
 drawGraph(id);
 if(scroll)window.scrollTo({top:0,behavior:'instant'});
 try{localStorage.setItem('xhs-architecture-manual-chapter',id);}catch{}
}
document.addEventListener('click',event=>{const button=event.target.closest('[data-chapter]');if(button)activate(button.dataset.chapter);});
const observer=new ResizeObserver(()=>drawGraph(active));observer.observe(document.querySelector('.main'));
window.addEventListener('beforeprint',()=>{document.querySelectorAll('.chapter').forEach(el=>el.hidden=false);chapters.forEach(c=>drawGraph(c.id));});
window.addEventListener('afterprint',()=>activate(active,false));

updateCaseFAQ(D.handoff.case.steps[0].id);renderTroubles();updateTroubleFAQ(selectedTrouble);
document.getElementById('trouble-search').addEventListener('input',renderTroubles);
document.addEventListener('click',event=>{
 const route=event.target.closest('[data-guide-chapter]');
 if(route){followGuide({chapter:route.dataset.guideChapter,node:route.dataset.guideNode,code:route.dataset.guideCode});return;}
 const step=event.target.closest('[data-case-step]');
 if(step){updateCaseFAQ(step.dataset.caseStep,true);document.getElementById('case-detail').scrollIntoView({behavior:'instant',block:'start'});return;}
 const trouble=event.target.closest('[data-trouble]');
 if(trouble){updateTroubleFAQ(trouble.dataset.trouble,true);document.getElementById('trouble-detail').scrollIntoView({behavior:'instant',block:'start'});}
});


updateExceptionFAQ(D.handoff.exception.steps[0].id);
document.getElementById('return-origin').addEventListener('click',returnToOrigin);
document.querySelectorAll('[data-graph-search]').forEach(input=>{
 input.addEventListener('input',()=>renderGraphSearch(input.dataset.graphSearch));
 input.addEventListener('keydown',event=>{
  if(event.key==='Escape'&&!document.getElementById('graph-search-results-'+input.dataset.graphSearch).hidden){closeGraphSearch(input.dataset.graphSearch);event.stopPropagation();}
  if(event.key==='Enter'){
   const first=document.querySelector('#graph-search-results-'+input.dataset.graphSearch+' [data-find-node]');
   if(first){event.preventDefault();followGraphSearch(first);}
  }
 });
});
document.addEventListener('click',event=>{
 const ret=event.target.closest('[data-return-graph]');
 if(ret){returnToGraph(ret.dataset.returnGraph,ret.dataset.returnNode);return;}
 const tool=event.target.closest('[data-graph-action]');
 if(tool){
  const id=tool.dataset.owner,action=tool.dataset.graphAction;
  if(action==='full')setExpandedGraph(id,expandedGraph!==id);
  else if(action==='fit')setGraphZoom(id,(document.getElementById('graph-'+id).closest('.graph-scroll').clientWidth-12)/document.getElementById('graph-'+id).offsetWidth);
  else setGraphZoom(id,action==='reset'?1:(graphZoom[id]||1)+(action==='in'?.2:-.2));
  return;
 }
 const found=event.target.closest('[data-find-node]');if(found){followGraphSearch(found);return;}
 const exception=event.target.closest('[data-exception-step]');
 if(exception){updateExceptionFAQ(exception.dataset.exceptionStep,true);document.getElementById('exception-detail').scrollIntoView({behavior:'instant',block:'start'});return;}
 if(!event.target.closest('.graph-search-box'))document.querySelectorAll('[data-graph-search]').forEach(input=>closeGraphSearch(input.dataset.graphSearch));
});
document.addEventListener('keydown',event=>{
 if(!expandedGraph)return;
 if(event.key==='Escape'){setExpandedGraph(expandedGraph,false);return;}
 if(event.key==='Tab'){
  const sheet=document.querySelector('.architecture-sheet.is-expanded'),items=[...sheet.querySelectorAll('button:not(:disabled),input')].filter(el=>el.getClientRects().length),first=items[0],last=items[items.length-1];
  if(event.shiftKey&&document.activeElement===first){event.preventDefault();last.focus();}
  else if(!event.shiftKey&&document.activeElement===last){event.preventDefault();first.focus();}
 }
});
window.addEventListener('resize',()=>drawGraph(active));

let initial='guide';try{initial=localStorage.getItem('xhs-architecture-manual-chapter')||'guide';}catch{}
activate(initial,false);
})();
</script>
